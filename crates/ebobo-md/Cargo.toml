[package]
name = "ebobo-md"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deterministic Sega Mega Drive / Genesis emulator core for rollback netplay"

# One feature per part, so each can be built and tested alone while it is written:
#   cargo test -p ebobo-md --no-default-features --features fm
[features]
default = ["system"]
cart = []
io = []
fm = []
psg = []
vdp-sprites = []
vdp-render = ["vdp-sprites"]
vdp = ["vdp-render"]
system = ["cart", "io", "fm", "psg", "vdp"]

[dependencies]
ebobo-m68k = { path = "../ebobo-m68k" }
ebobo-z80 = { path = "../ebobo-z80" }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
bincode = "1.3"
