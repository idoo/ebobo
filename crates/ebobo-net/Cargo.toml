[package]
name = "ebobo-net"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rollback netplay for ebobo: rooms, NAT hole punching, relay fallback, GGRS sessions"

[dependencies]
ebobo-core = { path = "../ebobo-core" }
bincode = "1.3"
ggrs = "0.13"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# tungstenite's rustls feature picks no crypto provider; exactly one enabled is auto-selected.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Root certificates for the network self-test's plain HTTPS GET (same crate tungstenite uses).
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
# TURN (turn.rs): MESSAGE-INTEGRITY (HMAC-SHA1), long-term key (MD5), FINGERPRINT (CRC32).
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
crc32fast = "1"
